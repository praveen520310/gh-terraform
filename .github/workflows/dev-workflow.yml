name: Terraform Dev Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Check Repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Debug OIDC Claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"

          headers = {
              "Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          }

          req = urllib.request.Request(url, headers=headers)
          data = json.load(urllib.request.urlopen(req))

          jwt = data["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in [
              "sub",
              "aud",
              "ref",
              "repository",
              "repository_owner",
              "workflow",
              "environment",
              "event_name"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: AWS access using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::131166810375:role/github-oidc-vcube
          role-session-name: github-actions
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -var-file=dev.tfvars


  apply:
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: dev

    steps:

      - name: Check Repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Debug OIDC Claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"

          headers = {
              "Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          }

          req = urllib.request.Request(url, headers=headers)
          data = json.load(urllib.request.urlopen(req))

          jwt = data["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in [
              "sub",
              "aud",
              "ref",
              "repository",
              "repository_owner",
              "workflow",
              "environment",
              "event_name"
          ]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: AWS access using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::131166810375:role/github-oidc-vcube
          role-session-name: github-actions
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=dev.tfvars